name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o passkit ./cmd/passkit

      - name: Cross-compile
        strategy:
          matrix:
            include:
              - goos: linux
                goarch: amd64
              - goos: linux
                goarch: arm64
              - goos: darwin
                goarch: amd64
              - goos: darwin
                goarch: arm64
              - goos: windows
                goarch: amd64
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -ldflags "-s -w" -o passkit-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/passkit

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: passkit-${{ matrix.goos }}-${{ matrix.goarch }}
