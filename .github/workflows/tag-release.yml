name: Tag & Release

on:
  push:
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagged: ${{ steps.tag.outputs.tagged }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=v$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api repos/${{ github.repository }}/git/refs/tags/${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.tag.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/${{ steps.version.outputs.version }}" \
            -f sha="${{ github.sha }}"

  cross-compile:
    needs: tag
    if: needs.tag.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -ldflags "-s -w" -o passkit-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/passkit
          tar czf passkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz passkit-${{ matrix.goos }}-${{ matrix.goarch }} README.md

      - uses: actions/upload-artifact@v4
        with:
          name: passkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: passkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  release:
    needs: [tag, cross-compile]
    if: needs.tag.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.tag.outputs.version }}"
          # Create release
          gh release create "$VERSION" \
            --repo ${{ github.repository }} \
            --title "passkit $VERSION" \
            --notes "passkit $VERSION release" \
            artifacts/passkit-*/*.tar.gz

      - name: Generate and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.tag.outputs.version }}"
          cd artifacts
          find . -name "*.tar.gz" -exec sha256sum {} \; > checksums.txt
          gh release upload "$VERSION" \
            --repo ${{ github.repository }} \
            checksums.txt
